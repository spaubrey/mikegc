name: Cloudflare deployment checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'frontend/**'
      - 'backend/**'
      - 'packages/**'
      - '.github/workflows/cloudflare.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'frontend/**'
      - 'backend/**'
      - 'packages/**'
      - '.github/workflows/cloudflare.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Deployment runtime tests
        run: node --test cloudflare/*.test.mjs
      - name: Install the repository's locked Wrangler version
        run: npm ci --prefix frontend
      - name: Validate Worker and Container configuration without deployment
        run: frontend/node_modules/.bin/wrangler deploy --config cloudflare/wrangler.json --dry-run --outdir "$RUNNER_TEMP/mikegc-worker"
      - uses: docker/setup-buildx-action@v4
      - name: Build combined application image from repository root
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cloudflare/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=cloudflare
          cache-to: type=gha,mode=max,scope=cloudflare
